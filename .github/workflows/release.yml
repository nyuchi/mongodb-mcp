name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: nyuchi/.github/.github/workflows/reusable-release.yml@c2e2506a4eadf67fbf824b41720aa220c539fc21  # main 2026-10-04
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
