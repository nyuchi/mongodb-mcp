name: Deploy

# Production deploys run from GitHub Actions, not the dashboard-connected
# Workers Builds (owner rule, 2026-10-05: the first deploy of a Worker is
# manual, every later one is CI). When "CI" passes on `main`, this deploys
# that same commit as `mongodb-mcp` (mongodb.nyuchi.dev).
#
# Staging never deploys: it uploads a preview version (beta.yml).
#
# Skips cleanly when CLOUDFLARE_API_TOKEN is not available to the repo, or when
# the Worker has never been deployed (that first deploy stays manual).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; no deploy."

      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          # The commit CI passed on, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "24"
          cache: npm

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      # CI runs on main are not cancelled, so they can finish out of order.
      # Only deploy the commit that is still the tip of main; a newer commit's
      # own CI run deploys it, so an older one never rolls production back.
      - name: Still the tip of main
        id: tip
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${SHA::7} is no longer the tip of main (${tip::7}); its CI run deploys instead."
          fi

      # Only a Worker that does not exist yet skips (its first deploy is
      # manual). Any other wrangler failure (token scope, account, outage)
      # fails the job instead of silently leaving production behind.
      - name: Worker exists
        id: exists
        if: steps.tip.outputs.ok == 'true'
        run: |
          if out=$(npx wrangler deployments list 2>&1); then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -qiE '\[code: 10007\]|Worker does not exist'; then
            echo "::notice::mongodb-mcp has never been deployed; the first deploy is manual."
          else
            echo "$out" | tail -20
            echo "::error::wrangler deployments list failed; not deploying."
            exit 1
          fi

      - name: wrangler deploy
        if: steps.exists.outputs.ok == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npx wrangler deploy --message "main ${SHA::7}"
