name: Beta

# The live beta (nyuchi/.github#84): every push to `staging` uploads the
# Worker as a new VERSION under the preview alias `staging`, served at
# https://staging-mongodb-mcp.nyuchi.workers.dev. `wrangler versions upload`
# never deploys, so production (mongodb.nyuchi.dev) is untouched.
#
# Skips cleanly when CLOUDFLARE_API_TOKEN is not available to the repo.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-staging
  cancel-in-progress: true

jobs:
  upload:
    name: Upload the staging version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/staging'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; no beta upload."

      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "24"
          cache: npm

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: wrangler versions upload --preview-alias staging
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          SHA: ${{ github.sha }}
        run: npx wrangler versions upload --preview-alias staging --message "staging ${SHA::7}"
