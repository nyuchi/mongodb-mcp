name: auto-tag

# Tags the next version on every push to main, under the org versioning
# policy (nyuchi/.github#80):
#   a merge into staging ........ PATCH (staging-version.yml)
#   a push to main (a release) .. MINOR (this workflow)
#   MAJOR ....................... only ever by hand: run this workflow with
#                                 bump: major
# Each segment holds 0..999; minor 999 stops and asks for that manual major.
# The version is computed from the highest v* tag by the shared next-version
# action, inside reusable-auto-tag.yml (no version file in this repo).
# Before 2026-10-04 conventional-commit prefixes chose the bump; versions
# released under that rule are not renumbered.
#
# The tag is pushed with the PAT (`RELEASE_BUMP_TOKEN`): GITHUB_TOKEN-pushed
# tags do not trigger downstream workflows, so without it release.yml would
# never fire and no SBOM/release would be cut. The reusable workflow hands the
# PAT only to its push step.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump for this release. major is only ever made by hand, here.
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    uses: nyuchi/.github/.github/workflows/reusable-auto-tag.yml@924e5b4d0983d31379aedbec02b990793f29c792  # main, 2026-10-04
    with:
      channel: main
      bump: ${{ inputs.bump || '' }}
    secrets:
      token: ${{ secrets.RELEASE_BUMP_TOKEN }}
