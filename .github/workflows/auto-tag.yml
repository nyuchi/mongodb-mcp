name: auto-tag

# Bumps a semver tag on every push to main. Conventional-commit prefixes drive
# the bump:
#   feat: ............ minor
#   fix: / perf: ..... patch
#   chore: / docs: ... patch (default_bump)
#   BREAKING CHANGE .. major
#
# A PAT is required (`RELEASE_BUMP_TOKEN`, fine-grained, scope = contents:write
# + actions:read on this repo). GITHUB_TOKEN-pushed tags do not trigger
# downstream workflows, so without the PAT the release.yml caller would never
# fire and no SBOM/release would be cut.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # History for the commit analysis only; the action creates the tag
      # through the API, so the checkout keeps no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bump semver tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.RELEASE_BUMP_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: main
          create_annotated_tag: true
