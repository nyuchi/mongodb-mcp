name: auto-tag

# Versioning policy (nyuchi/.github#80): a release to main is the next MINOR
# above the highest tag; merges into staging are tagged as patches by
# staging-version.yml; a MAJOR is only ever made by hand, from the Actions
# tab with bump: major. Each segment holds 0..999.
#
# The version is COMPUTED from the tags (package.json is not the source of
# the release version here). The tag is pushed with RELEASE_BUMP_TOKEN so
# that release.yml (on `push: tags`) starts; a GITHUB_TOKEN tag would not
# start it. The logic is nyuchi/.github's reusable-auto-tag.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Versioning policy override. main releases the next minor; a major
          is only ever made by hand, here.
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    uses: nyuchi/.github/.github/workflows/reusable-auto-tag.yml@924e5b4d0983d31379aedbec02b990793f29c792 # main, 2026-10-04
    with:
      channel: main
      bump: ${{ inputs.bump || '' }}
    secrets:
      token: ${{ secrets.RELEASE_BUMP_TOKEN }}
